# UB Shield — Nginx site configuration
#
# The application already sets every security header itself (see
# App\Http\Middleware\SecurityHeaders), so this file deliberately does NOT
# duplicate them: two sources for one header is how they drift apart. What
# Nginx is responsible for here is TLS, compression and cache lifetimes —
# the three things `php artisan serve` cannot do, and the three things
# Lighthouse flags when you measure against the dev server.
#
#   sudo ln -s /etc/nginx/sites-available/ubshield /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name ubshield.com www.ubshield.com;

    # ACME challenges must stay on HTTP.
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://ubshield.com$request_uri; }
}

# Canonical host: one origin, so the canonical tags and the HSTS policy agree.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.ubshield.com;

    ssl_certificate     /etc/letsencrypt/live/ubshield.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ubshield.com/privkey.pem;

    return 301 https://ubshield.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ubshield.com;

    root /var/www/ubshield/public;
    index index.php;
    charset utf-8;

    # ---- TLS ---------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/ubshield.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ubshield.com/privkey.pem;

    # TLS 1.2 and 1.3 only. The hero artwork claims "TLS 1.3 ONLY" as a design
    # element; 1.2 is kept for real-world compatibility, so do not read the
    # illustration as a statement of configuration.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ---- compression -------------------------------------------------------
    # Worth ~79 KB on the homepage: the HTML is ~53 KB and the CSS ~37 KB, and
    # both are highly repetitive inline SVG and CSS.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/ld+json
        application/xml application/rss+xml
        image/svg+xml font/woff2;

    # Brotli beats gzip by a further 15-20% on this kind of content. Requires
    # ngx_brotli; uncomment once the module is installed.
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css application/javascript application/json application/ld+json image/svg+xml;

    # ---- caching -----------------------------------------------------------
    # Vite fingerprints everything under /build, so it is immutable.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Self-hosted fonts are versioned by hand; a year is still safe because a
    # replacement would be a new filename.
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
        try_files $uri =404;
    }

    location /images/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    location = /robots.txt  { expires 1d; access_log off; }
    location = /favicon.ico { expires 30d; access_log off; log_not_found off; }

    # ---- application -------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        include fastcgi_params;

        fastcgi_buffering on;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60s;
    }

    # ---- hardening ---------------------------------------------------------
    # Never serve dotfiles, and never hand out a .env if a deploy goes wrong.
    location ~ /\.(?!well-known).* { deny all; return 404; }
    location ~* \.(env|log|sql|sqlite|bak|ini|yml|yaml|lock|json)$ { deny all; return 404; }
    location ~ ^/(storage/framework|bootstrap/cache|vendor|tests)/ { deny all; return 404; }

    # Nginx version in the Server header is free reconnaissance.
    server_tokens off;

    # The admin is for staff; rate-limit the login specifically.
    location = /admin/login {
        limit_req zone=login burst=5 nodelay;
        try_files $uri /index.php?$query_string;
    }

    client_max_body_size 12M;
    error_page 404 /index.php;
}

